buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Firebase Cloud Messaging (push); reads app/google-services.json.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"

// payu-non-seam-less-react declares BuildConfig fields but doesn't enable
// BuildConfig, which current Android Gradle Plugin requires; turn it on for it.
subprojects { p ->
    if (p.name == "payu-non-seam-less-react") {
        p.pluginManager.withPlugin("com.android.library") {
            p.android.buildFeatures.buildConfig = true
        }
    }
}

// PayU's checkout pulls in PhonePe's intent SDK, published only on PhonePe's repository.
allprojects {
    repositories {
        maven { url "https://phonepe.mycloudrepo.io/public/repositories/phonepe-intentsdk-android" }
    }
}
